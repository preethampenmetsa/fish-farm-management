{% extends "base.html" %}
{% block content %}

<h2>Record Feed Usage</h2>

{% if messages %}
    {% for message in messages %}
        <p style="color:red;">{{ message }}</p>
    {% endfor %}
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>

<br>
<a href="{% url 'feed:feed-dashboard' %}">Back to Dashboard</a>

{% endblock %}
